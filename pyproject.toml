[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-critic"
version = "3.4.0"
license = {text = "PolyForm-Noncommercial-1.0.0"}
# tomllib (stdlib since 3.11) is used by the release guard and the workflows;
# the CI matrix and the Windows build both pin 3.11.
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4,<1.5",
    "python-docx",
    # Imported directly by src/output/report_exporter.py (not only via python-docx).
    "lxml",
    "pypdf",
    "pydantic",
    "tiktoken",
    "customtkinter",
    "platformdirs",
    "tkinterdnd2",
    # OS credential store for the API key (src/core/api_key_store.py falls back
    # to the key file when the import or backend fails); the Windows build
    # bundles its Credential Manager backend.
    "keyring",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "token_budget: Chunk E token counting and output budget regression tests",
    "prompt_serialization: Chunk G prompt boundary / serialization hardening tests",
    "network: tests that require real Anthropic API access (skipped by default)",
]
